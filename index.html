    <!DOCTYPE html>
    <html lang="ko">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>음악 임용 암기 트레이너</title>
    <link rel="stylesheet" href="style.css">
    </head>

    <body>

    <div id="startGate" class="startGate">
        <div class="startCard">
            <h1>🎵 음악 임용 암기 트레이너</h1>
            <p><strong>그럼에도 불구하고.</strong></p>
            <input id="startPhraseInput" type="text" autocomplete="off" placeholder="시작 문구 입력">
            <button id="startGateButton" type="button">시작하기</button>
            <p id="startGateMessage" class="startGateMessage" aria-live="polite"></p>
        </div>
    </div>

    <div id="appContent" class="container" style="display:none;">

    <h1>🎵 음악 임용 암기 트레이너</h1>

    <div id="appModeOption" class="homeCard">

        <h2>학습 종류</h2>
<label><input type="radio" name="appMode" value="music"> 음악요소 암기</label>
<label><input type="radio" name="appMode" value="core"> 핵심 아이디어 암기</label>
<label><input type="radio" name="appMode" value="methods"> 방법과 평가</label>

        <label>
            <input type="radio" name="appMode" value="study" checked>
            성취기준 암기
        </label>

        <label style="margin-left:20px;">
            <input type="radio" name="appMode" value="element">
            내용요소 암기
        </label>

    </div>

    <div id="home">

    <div class="homeGrid">

        <!-- 공통 -->
        <div class="homeCard">

            <h2>공통</h2>

            <div class="checkGrid">

                <label><input type="checkbox" value="중학교|연주"> 중학교 연주</label>
                <label><input type="checkbox" value="고등학교|연주"> 고등학교 연주</label>

                <label><input type="checkbox" value="중학교|감상"> 중학교 감상</label>
                <label><input type="checkbox" value="고등학교|감상"> 고등학교 감상</label>

                <label><input type="checkbox" value="중학교|창작"> 중학교 창작</label>
                <label><input type="checkbox" value="고등학교|창작"> 고등학교 창작</label>

            </div>

        </div>

        <!-- 진로선택 -->
        <div class="homeCard">

            <h2>진로선택</h2>

            <div class="career">

                <h3>음악 연주와 창작</h3>

                <label><input type="checkbox" value="음악 연주와 창작|표현과 창작"> 표현과 창작</label>
                <label><input type="checkbox" value="음악 연주와 창작|실천과 소통"> 실천과 소통</label>

                <h3>음악 감상과 비평</h3>

                <label><input type="checkbox" value="음악 감상과 비평|감상과 반응"> 감상과 반응</label>
                <label><input type="checkbox" value="음악 감상과 비평|비평과 활용"> 비평과 활용</label>

                <h3>음악과 미디어</h3>

                <label><input type="checkbox" value="음악과 미디어|미디어 탐구"> 미디어 탐구</label>
                <label><input type="checkbox" value="음악과 미디어|실용적 연계"> 실용적 연계</label>

            </div>

        </div>

    </div>
    <div id="methodSelection" class="homeCard" style="display:none;">
<h2>방법과 평가</h2>
<label><input type="checkbox" value="methods" checked> 교수학습방법 (16개)</label>
<label><input type="checkbox" value="evaluation" checked> 평가방법 (13개)</label>
<p>각 목록 전체를 한 번에 인출합니다. 답의 순서는 자유입니다.</p>
</div>
<div id="musicSelection" class="homeCard" style="display:none;"><h2>음악요소 선택</h2><div class="checkGrid"><label><input type="checkbox" value="music-중학교-0"> 중학교 리듬</label><label><input type="checkbox" value="music-중학교-1"> 중학교 가락</label><label><input type="checkbox" value="music-중학교-2"> 중학교 화성</label><label><input type="checkbox" value="music-중학교-3"> 중학교 형식</label><label><input type="checkbox" value="music-중학교-4"> 중학교 셈여림</label><label><input type="checkbox" value="music-중학교-5"> 중학교 빠르기</label><label><input type="checkbox" value="music-중학교-6"> 중학교 음색</label><label><input type="checkbox" value="music-고등학교-0"> 고등학교 리듬</label><label><input type="checkbox" value="music-고등학교-1"> 고등학교 가락</label><label><input type="checkbox" value="music-고등학교-2"> 고등학교 화성</label><label><input type="checkbox" value="music-고등학교-3"> 고등학교 형식</label><label><input type="checkbox" value="music-고등학교-4"> 고등학교 셈여림</label><label><input type="checkbox" value="music-고등학교-5"> 고등학교 빠르기</label><label><input type="checkbox" value="music-고등학교-6"> 고등학교 음색</label></div><p>선택한 학교급·요소마다 한 문제씩, 해당 내용을 모두 인출합니다.</p></div>
<div id="studyOption">

    <div class="homeCard settingCard">

        <h2>학습 설정</h2>

        <div class="settingGrid">

            <div>

                <h3>학습모드</h3>

                <label><input type="radio" name="studyMode" value="exam" checked> 시험모드</label>

                <label><input type="radio" name="studyMode" value="blank"> 빈칸모드</label>


                <label><input type="radio" name="studyMode" value="practice"> 연습모드</label>

            </div>

            <div>

                <h3>출제방식</h3>

                <label><input type="radio" name="mode" value="order" checked> 순서대로</label>

                <label><input type="radio" name="mode" value="random"> 랜덤</label>

            </div>

        </div>

    </div>

    </div> <!-- studyOption 끝 -->

    <div id="elementOption" style="display:none;">

        <div class="homeCard settingCard">

            <h2>내용요소 설정</h2>

            <h3>출제 방식</h3>

            <label>
                <input type="radio"
                    name="elementSourceMode"
                    value="area"
                    checked>
                영역 → 내용요소
            </label>

            <label style="margin-left:20px;">
                <input type="radio"
                    name="elementSourceMode"
                    value="standard">
                성취기준 → 내용요소
            </label>

            <hr>

        

            <h3>학습 모드</h3>

            <label>
                <input type="radio" name="elementStudyMode" value="exam" checked>
                시험모드
            </label>

            <label style="margin-left:20px;">
                <input type="radio" name="elementStudyMode" value="blank">
                빈칸모드
            </label>

            <label style="margin-left:20px;">
                <input type="radio" name="elementStudyMode" value="practice">
                연습모드
            </label>

            <p>선택한 영역마다 지식·이해, 과정·기능, 가치·태도를 인출합니다.</p>
        </div>

    </div>

    <div class="buttonBox">

        <button onclick="startQuiz()">시작하기</button>

        <button class="grayBtn" onclick="resetLevel()">학습 레벨 초기화</button>

    </div>

    </div>



    <div id="quiz" style="display:none;">

    <h3 id="school"></h3>
    <h2 id="area"></h2>
    <h2 id="code"></h2>

    <button
    id="toggleBtn"
    onclick="toggleQuestion()"
    style="display:none;">
    🙈 내용 숨기기
    </button>

    <div id="question"></div>

    <textarea id="answer"></textarea>

    <div id="elementAnswerBox" style="display:none;">

        <div id="knowledgeBox">
            <h3>지식·이해</h3>
            <textarea id="knowledgeAnswer"></textarea>
        </div>

        <div id="skillBox">
            <h3>과정·기능</h3>
            <textarea id="skillAnswer"></textarea>
        </div>

        <div id="attitudeBox">
            <h3>가치·태도</h3>
            <textarea id="attitudeAnswer"></textarea>
        </div>

    

    </div>

    <div id="progress"></div>

    <div class="buttons">
    <button id="submitBtn" onclick="checkAnswer()">제출</button>


    <button id="prevBtn" onclick="prevQuestion()">◀ 이전</button>



    <button id="nextBtn" onclick="nextQuestion()">다음 ▶</button>
    <button onclick="goHome()">🏠 홈</button>

    </div>

    <div id="result"></div>

    </div>

    </div>

    <script src="script.js"></script>
    <script src="study.js"></script>
    <script src="element.js"></script>
<script src="recall.js"></script>
<script src="session.js"></script>
    <script>
    (() => {
        const startGate = document.getElementById("startGate");
        const appContent = document.getElementById("appContent");
        const startPhraseInput = document.getElementById("startPhraseInput");
        const startGateButton = document.getElementById("startGateButton");
        const startGateMessage = document.getElementById("startGateMessage");

        function unlockProgram(){
            if(startPhraseInput.value.trim() === "서준혁 임용합격"){
                startGate.style.display = "none";
                appContent.style.display = "block";
            }else{
                startGateMessage.textContent = "문구가 일치하지 않습니다.";
                startPhraseInput.focus();
                startPhraseInput.select();
            }
        }

        startGateButton.addEventListener("click", unlockProgram);

        startPhraseInput.addEventListener("keydown", event => {
            if(event.key === "Enter") unlockProgram();
        });

        startPhraseInput.focus();
    })();
    </script>

    </body>
    </html>
